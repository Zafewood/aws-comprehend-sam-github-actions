<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sentiment Lens</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #182323;
      --muted: #60706d;
      --paper: #f7f5ef;
      --panel: #fffdf8;
      --line: #d8ded7;
      --teal: #087f76;
      --teal-dark: #075b56;
      --coral: #e7785b;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: radial-gradient(circle at 85% 10%, #d9eee5 0, transparent 32%), var(--paper);
      font: 16px/1.5 Georgia, serif;
    }
    main { width: min(880px, calc(100% - 32px)); margin: 0 auto; padding: 8vh 0 10vh; }
    header { display: flex; justify-content: space-between; gap: 24px; align-items: end; margin-bottom: 42px; }
    .kicker { color: var(--coral); font: 700 12px/1.2 system-ui, sans-serif; letter-spacing: 2px; text-transform: uppercase; }
    h1 { margin: 8px 0 0; max-width: 560px; font-size: clamp(2.6rem, 8vw, 5.8rem); line-height: .92; font-weight: 400; }
    header p { max-width: 230px; margin: 0; color: var(--muted); font: 15px/1.4 system-ui, sans-serif; }
    .workspace { display: grid; grid-template-columns: 1.1fr .9fr; gap: 18px; }
    section { padding: 26px; border: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 92%, transparent); box-shadow: 8px 8px 0 #dce7df; }
    label { display: block; margin-bottom: 10px; font: 700 13px system-ui, sans-serif; }
    textarea { width: 100%; min-height: 190px; resize: vertical; padding: 14px; border: 1px solid #bfcac2; border-radius: 2px; color: var(--ink); background: #fff; font: 18px/1.45 Georgia, serif; }
    textarea:focus { outline: 3px solid #b8e0d4; border-color: var(--teal); }
    button { margin-top: 16px; padding: 12px 18px; border: 0; border-radius: 2px; color: #fff; background: var(--teal); cursor: pointer; font: 700 14px system-ui, sans-serif; }
    button:hover { background: var(--teal-dark); }
    button:disabled { opacity: .55; cursor: wait; }
    #status { min-height: 24px; margin: 14px 0 0; color: var(--muted); font: 14px system-ui, sans-serif; }
    .result-empty { color: var(--muted); }
    .result-value { margin: 4px 0 22px; color: var(--teal-dark); font-size: 42px; line-height: 1; }
    .score { display: grid; grid-template-columns: 74px 1fr 58px; gap: 9px; align-items: center; margin: 12px 0; font: 14px system-ui, sans-serif; }
    .track { height: 9px; overflow: hidden; background: #e3e8e2; }
    .fill { height: 100%; background: var(--coral); transition: width .45s ease; }
    .number { text-align: right; color: var(--muted); }
    @media (max-width: 700px) {
      main { padding-top: 36px; }
      header { display: block; margin-bottom: 28px; }
      header p { margin-top: 18px; }
      .workspace { grid-template-columns: 1fr; }
      section { padding: 20px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <div class="kicker">AWS Comprehend</div>
        <h1>Read the feeling in a sentence.</h1>
      </div>
      <p>A small interface for turning language into a clear emotional signal.</p>
    </header>

    <div class="workspace">
      <section>
        <label for="text">Text to analyze</label>
        <textarea id="text" placeholder="Write or paste something here..."></textarea>
        <button id="analyze" type="button">Analyze sentiment</button>
        <p id="status" role="status"></p>
      </section>

      <section aria-live="polite">
        <div class="kicker">Result</div>
        <div id="result" class="result-empty">Your result will appear here.</div>
      </section>
    </div>
  </main>

  <script>
    // Replace this with the SentimentAPI URL from `sam deploy`.
    const API_URL = "https://YOUR_API_ID.execute-api.eu-west-1.amazonaws.com/Prod/sentiment/";
    const textInput = document.querySelector("#text");
    const analyzeButton = document.querySelector("#analyze");
    const status = document.querySelector("#status");
    const result = document.querySelector("#result");
    const labels = ["Positive", "Negative", "Neutral", "Mixed"];

    function renderResult(data) {
      const scores = data.sentimentScore;
      const toxicity = data.toxicity;
      result.className = "";
      const sentimentText = data.sentiment || "Not available for this language";
      const toxicityText = toxicity.supported
        ? `${toxicity.isToxic ? "Toxic" : "Not toxic"} (${(toxicity.score * 100).toFixed(1)}%)`
        : "Not available for this language";
      result.innerHTML = `<div class="kicker">Language</div><div class="result-value">${data.language.LanguageCode.toUpperCase()}</div>` +
        `<div class="kicker">Detected sentiment</div><div class="result-value">${sentimentText}</div>` +
        `<div class="kicker">Toxicity</div><div class="result-value">${toxicityText}</div>` +
        (scores ? labels.map((label) => {
          const score = Number(scores[label] || 0);
          return `<div class="score"><span>${label}</span><span class="track"><span class="fill" style="width: ${score * 100}%"></span></span><span class="number">${(score * 100).toFixed(1)}%</span></div>`;
        }).join("") : "");
    }

    async function analyze() {
      const text = textInput.value.trim();
      if (!text) {
        status.textContent = "Enter some text first.";
        return;
      }
      analyzeButton.disabled = true;
      status.textContent = "Analyzing...";
      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Request failed");
        renderResult(data);
        status.textContent = "Analysis complete.";
      } catch (error) {
        status.textContent = error.message;
      } finally {
        analyzeButton.disabled = false;
      }
    }

    analyzeButton.addEventListener("click", analyze);
    textInput.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key === "Enter") analyze();
    });
  </script>
</body>
</html>
